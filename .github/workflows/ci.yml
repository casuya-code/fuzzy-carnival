name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi==0.111.0 uvicorn==0.30.1 pydantic==2.7.4 python-multipart==0.0.9 boto3==1.34.131 requests>=2.31.0 Pillow>=10.0.0 numpy>=1.24 scipy>=1.10
      - name: Compile backend
        run: python -m compileall app tests
      - name: Run tests
        env:
          EXPOSE_HEALTH_DETAILS: "false"
          REQUIRE_AUTH: "false"
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q
      - name: Dependency audit (report-only)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Test
        run: npm test
      - name: Dependency audit (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high || true
      - name: Build
        env:
          NEXT_PUBLIC_RAILWAY_API_URL: http://127.0.0.1:8000
        run: npm run build
